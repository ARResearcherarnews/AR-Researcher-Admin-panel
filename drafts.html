<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F1B2D">
  <title>AI নিউজরুম | AR News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- কভার ছবিতে বাংলা লেখা আঁকতে Hind Siliguri লাগে -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    :root {
      --brand: #0b3d91; --brand-ink: #082f73; --brand-soft: #eaf0fb;
      --ink: #172033; --muted: #64748b; --line: #e5e7eb; --bg: #f8fafc; --surface: #fff;
      --danger: #dc2626; --danger-soft: #fee2e2; --warn: #b45309; --warn-soft: #fef3c7;
      --shadow: none;
      --font-display: system-ui, -apple-system, "Noto Sans Bengali", "Hind Siliguri", sans-serif;
    }
    body { font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif; color: #0F1B2D; background: #F3F5F8; padding-bottom: 85px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .main { max-width: none; margin: 0; padding: 0; }
    .msg { margin-top: 10px; font-size: 13.5px; font-weight: 600; line-height: 1.6; overflow-wrap: anywhere; }
    .msg:empty { display: none; }

    /* ===== AR News — AI নিউজরুম প্যানেল (ফুল স্ক্রিন) ===== */
    #ar-drafts-overlay { position: static; --d-ink:#0F1B2D; --d-mut:#4A5568; --d-line:#E1E5EC; --d-red:#B3122A; --d-red2:#8E0E21; --d-navy:#0F1B2D; --d-navy2:#1C2B45; --d-ok:#14703F; --d-okb:#E3F4EA; --d-warn:#8A5300; --d-warnb:#FFF1D6; --d-bad:#B3122A; --d-badb:#FDE7EA; --d-blue:#1F4E9C; --d-blueb:#E8EEF9; }
    #ar-drafts-overlay .dr-wrap { max-width: none; }
    #ar-drafts-overlay .dr-app { display: grid; grid-template-columns: 240px minmax(0,1fr); min-height: 100vh; }
    #ar-drafts-overlay .dr-side { background: var(--d-navy); color: #fff; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; align-self: start; overflow-y: auto; }
    #ar-drafts-overlay .dr-brand { padding: 4px 12px 16px; }
    #ar-drafts-overlay .dr-brand small { display: block; font-size: 12px; color: #B8C2D6; letter-spacing: .05em; }
    #ar-drafts-overlay .dr-brand b { font-size: 21px; font-weight: 700; }
    #ar-drafts-overlay .dr-nav { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; border: 0; background: transparent; color: #C7D0E0; padding: 11px 12px; border-radius: 10px; font-size: 15px; min-height: 44px; }
    #ar-drafts-overlay .dr-nav:hover { background: var(--d-navy2); }
    #ar-drafts-overlay .dr-nav.on { background: var(--d-navy2); color: #fff; font-weight: 600; }
    #ar-drafts-overlay .dr-content { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    #ar-drafts-overlay .dr-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #ar-drafts-overlay .dr-top h2 { flex: 1; margin: 0; font-size: 24px; font-weight: 700; color: var(--d-ink); }
    #ar-drafts-overlay .dr-sub { font-size: 14px; color: var(--d-mut); margin-top: 2px; }
    #ar-drafts-overlay .dr-stats { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; }
    #ar-drafts-overlay .dr-stat { background: #fff; border: 1px solid var(--d-line); border-radius: 14px; padding: 16px; }
    #ar-drafts-overlay .dr-stat b { display: block; font-size: 28px; line-height: 1.2; color: var(--d-ink); }
    #ar-drafts-overlay .dr-stat span { font-size: 13px; color: var(--d-mut); }
    #ar-drafts-overlay .btn { border: 0; border-radius: 10px; min-height: 44px; padding: 0 16px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; background: var(--d-red); color: #fff; }
    #ar-drafts-overlay .btn:hover { background: var(--d-red2); }
    #ar-drafts-overlay .btn:disabled { opacity: .55; cursor: not-allowed; }
    #ar-drafts-overlay .btn.secondary, #ar-drafts-overlay .btn.ghost { background: #fff; color: var(--d-ink); border: 1px solid #CBD2DE; }
    #ar-drafts-overlay .btn.secondary:hover, #ar-drafts-overlay .btn.ghost:hover { background: #F3F5F8; }
    #ar-drafts-overlay .btn.danger { background: var(--d-badb); color: var(--d-bad); }
    #ar-drafts-overlay .btn.dark { background: var(--d-navy); color: #fff; }
    #ar-drafts-overlay .btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; }
    #ar-drafts-overlay .msg.ok { color: var(--d-ok); }
    #ar-drafts-overlay .msg.bad { color: var(--d-bad); }
    #ar-drafts-overlay .dr-seg { display: flex; gap: 8px; flex-wrap: wrap; }
    #ar-drafts-overlay .dr-seg button { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #CBD2DE; background: #fff; color: var(--d-ink); font-weight: 600; font-size: 14.5px; }
    #ar-drafts-overlay .dr-seg button.on { background: var(--d-navy); color: #fff; border-color: var(--d-navy); }
    #ar-drafts-overlay .dr-seg .gap { margin-left: auto; }
    #ar-drafts-overlay .dr-table { background: #fff; border: 1px solid var(--d-line); border-radius: 14px; overflow: hidden; }
    #ar-drafts-overlay .dr-row { display: grid; grid-template-columns: minmax(0,3fr) 130px 140px 70px 70px 84px; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--d-line); cursor: pointer; }
    #ar-drafts-overlay .dr-row:hover { background: #F8F9FB; }
    #ar-drafts-overlay .dr-row.hd { border-top: 0; background: #F8F9FB; font-size: 12px; font-weight: 600; color: var(--d-mut); cursor: default; }
    #ar-drafts-overlay .dr-row .t { font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--d-ink); overflow-wrap: anywhere; }
    #ar-drafts-overlay .dr-row .m, #ar-drafts-overlay .dr-meta { font-size: 13px; color: var(--d-mut); line-height: 1.6; }
    #ar-drafts-overlay .dr-row .n { font-size: 14px; font-weight: 600; color: var(--d-ink); }
    #ar-drafts-overlay .dr-row .mob { display: none; margin-top: 4px; }
    #ar-drafts-overlay .dr-pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; margin-right: 6px; background: var(--d-blueb); color: var(--d-blue); white-space: nowrap; }
    #ar-drafts-overlay .st-verified, #ar-drafts-overlay .rv-approved, #ar-drafts-overlay .p-ok { background: var(--d-okb); color: var(--d-ok); }
    #ar-drafts-overlay .st-partially_verified, #ar-drafts-overlay .p-warn { background: var(--d-warnb); color: var(--d-warn); }
    #ar-drafts-overlay .st-unverified, #ar-drafts-overlay .rv-pending_review { background: #EEF0F4; color: #3B4557; }
    #ar-drafts-overlay .st-false_misleading, #ar-drafts-overlay .rv-review_required, #ar-drafts-overlay .rv-rejected, #ar-drafts-overlay .p-bad { background: var(--d-badb); color: var(--d-bad); }
    #ar-drafts-overlay .dr-two { display: grid; grid-template-columns: minmax(0,1fr) 400px; gap: 18px; align-items: start; }
    #ar-drafts-overlay .dr-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    #ar-drafts-overlay .dr-card { background: #fff; border: 1px solid var(--d-line); border-radius: 14px; padding: 16px; }
    #ar-drafts-overlay .dr-card h4 { margin: 0 0 10px; font-size: 16px; font-weight: 700; color: var(--d-ink); }
    #ar-drafts-overlay .dr-warn { background: var(--d-warnb); color: var(--d-warn); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; line-height: 1.6; margin-bottom: 10px; }
    #ar-drafts-overlay .dr-claim { border-top: 1px solid var(--d-line); padding: 10px 0; font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
    #ar-drafts-overlay .dr-claim:first-of-type { border-top: 0; }
    #ar-drafts-overlay .dr-claim small, #ar-drafts-overlay .dr-note { display: block; color: var(--d-mut); font-size: 13px; line-height: 1.6; }
    #ar-drafts-overlay .dr-claim a, #ar-drafts-overlay ul.dr-links a { color: var(--d-blue); text-decoration: underline; overflow-wrap: anywhere; }
    #ar-drafts-overlay ul.dr-links { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.8; }
    #ar-drafts-overlay .dr-gate { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.6; padding: 4px 0; }
    #ar-drafts-overlay .dr-gate .dr-pill { min-width: 48px; text-align: center; margin-right: 0; }
    #ar-drafts-overlay .dr-f { margin-bottom: 12px; }
    #ar-drafts-overlay .dr-f label { display: block; font-size: 13px; font-weight: 600; color: var(--d-mut); margin-bottom: 5px; }
    #ar-drafts-overlay .dr-f input[type=text], #ar-drafts-overlay .dr-f textarea, #ar-drafts-overlay .dr-f select { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid #CBD2DE; border-radius: 10px; background: #fff; color: var(--d-ink); }
    #ar-drafts-overlay .dr-f select { min-height: 46px; padding: 0 12px; }
    #ar-drafts-overlay .dr-f textarea { line-height: 1.8; min-height: 90px; resize: vertical; }
    #ar-drafts-overlay #dr-content { min-height: 320px; font-size: 17px; }
    #ar-drafts-overlay #dr-title { font-size: 19px; font-weight: 700; }
    #ar-drafts-overlay .dr-f input:focus, #ar-drafts-overlay .dr-f textarea:focus, #ar-drafts-overlay .dr-f select:focus { outline: 2px solid var(--d-blue); outline-offset: 1px; }
    #ar-drafts-overlay .dr-chk { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin: 8px 0; line-height: 1.6; }
    #ar-drafts-overlay .dr-chk input { margin-top: 5px; width: 18px; height: 18px; }
    #ar-drafts-overlay .dr-imgprev { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; border: 1px solid var(--d-line); margin-top: 8px; }
    #ar-drafts-overlay .dr-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    #ar-drafts-overlay .dr-actions .btn { flex: 1 1 auto; }
    #ar-drafts-overlay .dr-empty { color: var(--d-mut); text-align: center; padding: 34px 12px; font-size: 14px; border: 1px dashed #CBD2DE; border-radius: 14px; background: #fff; }
    #ar-drafts-overlay .dr-opt { display: block; width: 100%; text-align: left; margin: 0 0 8px; padding: 12px 14px; border: 1px solid #CBD2DE; border-radius: 12px; background: #fff; color: var(--d-ink); }
    #ar-drafts-overlay .dr-opt b { display: block; font-size: 15px; line-height: 1.5; font-weight: 600; }
    #ar-drafts-overlay .dr-opt small { display: block; margin-top: 2px; color: var(--d-mut); font-size: 13px; line-height: 1.5; }
    #ar-drafts-overlay .dr-opt:hover { border-color: var(--d-blue); }
    #ar-drafts-overlay .dr-opt.on { border-color: var(--d-blue); background: var(--d-blueb); }
    #ar-drafts-overlay .dr-ul { margin: 6px 0 0; padding-left: 20px; font-size: 14.5px; line-height: 1.8; }
    #ar-drafts-overlay #dr-cover { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--d-line); margin: 8px 0; }
    #ar-drafts-overlay .dr-sthead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #ar-drafts-overlay .dr-sthead h4 { flex: 1; margin: 0; }
    #ar-drafts-overlay .dr-mrow { padding: 10px 0; border-top: 1px solid var(--d-line); }
    #ar-drafts-overlay .dr-mrow:first-of-type { border-top: 0; }
    #ar-drafts-overlay .dr-mname { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; align-items: baseline; }
    #ar-drafts-overlay .dr-mname span { color: var(--d-mut); font-size: 13px; white-space: nowrap; }
    #ar-drafts-overlay .dr-mrow small { display: block; color: var(--d-mut); font-size: 12.5px; line-height: 1.6; margin-top: 3px; }
    #ar-drafts-overlay .dr-bar { height: 7px; border-radius: 99px; background: var(--d-line); overflow: hidden; margin-top: 5px; }
    #ar-drafts-overlay .dr-bar i { display: block; height: 100%; background: var(--d-navy); border-radius: 99px; }
    #ar-drafts-overlay .dr-bar i.hi { background: var(--d-bad); }
    #ar-drafts-overlay .dr-sum { font-size: 14px; line-height: 1.8; margin: 8px 0 2px; }
    #ar-drafts-overlay .bad { color: var(--d-bad); }
    #ar-drafts-overlay .dr-lg { font-size: 13px; line-height: 1.6; padding: 7px 0; border-top: 1px solid var(--d-line); overflow-wrap: anywhere; }
    #ar-drafts-overlay .dr-lg time { color: var(--d-mut); margin-right: 6px; }
    #ar-drafts-overlay .dr-lg.bad b { color: var(--d-bad); }
    #ar-drafts-overlay .dr-lg small { display: block; color: var(--d-bad); }
    #ar-drafts-overlay .dr-tabn { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--d-red); color: #fff; font-size: 11.5px; line-height: 20px; text-align: center; }
    @media (max-width: 900px) {
      #ar-drafts-overlay .dr-app { grid-template-columns: minmax(0,1fr); }
      #ar-drafts-overlay .dr-side { position: static; height: auto; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 12px; gap: 4px; }
      #ar-drafts-overlay .dr-brand { display: none; }
      #ar-drafts-overlay .dr-nav { white-space: nowrap; width: auto; flex: 0 0 auto; }
      #ar-drafts-overlay .dr-content { padding: 16px; }
      #ar-drafts-overlay .dr-stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
      #ar-drafts-overlay .dr-row { grid-template-columns: minmax(0,1fr) auto; }
      #ar-drafts-overlay .dr-row .hide, #ar-drafts-overlay .dr-row.hd { display: none; }
      #ar-drafts-overlay .dr-row .mob { display: block; }
      #ar-drafts-overlay .dr-two { grid-template-columns: minmax(0,1fr); }
      #ar-drafts-overlay .dr-seg .gap { margin-left: 0; }
    }

    /* ===== নতুন কাঠামো: নিজস্ব হেডার + নিচের নেভিগেশন বার ===== */
    body { padding-bottom: 0 !important; }
    #ar-drafts-overlay .dr-app { display: flex; flex-direction: column; min-height: 100vh; grid-template-columns: none; }
    #ar-drafts-overlay .dr-hd { background: var(--d-navy); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; }
    #ar-drafts-overlay .dr-hd b { flex: 1; font-size: 18px; font-weight: 700; }
    #ar-drafts-overlay .dr-hd a { color: #C7D0E0; text-decoration: none; font-size: 14px; min-height: 44px; display: inline-flex; align-items: center; }
    #ar-drafts-overlay .dr-hd .dr-pill { margin: 0; }
    #ar-drafts-overlay .dr-content { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 16px; }
    #ar-drafts-overlay .dr-bnav { position: sticky; bottom: 0; z-index: 5; display: flex; background: #fff; border-top: 1px solid var(--d-line); padding: 6px 0 max(10px, env(safe-area-inset-bottom)); }
    #ar-drafts-overlay .dr-nv { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border: 0; background: transparent; color: var(--d-mut); font-size: 12px; }
    #ar-drafts-overlay .dr-nv.on { color: var(--d-red); font-weight: 600; }
    #ar-drafts-overlay .dr-stats3 { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
    #ar-drafts-overlay .dr-stats3 .dr-stat { position: relative; text-align: left; cursor: pointer; font-family: inherit; padding: 12px; }
    #ar-drafts-overlay .dr-stats3 .dr-stat i { position: absolute; right: 10px; top: 8px; font-style: normal; color: var(--d-mut); font-size: 18px; }
    #ar-drafts-overlay .dr-stats3 .dr-stat b { font-size: 26px; }
    #ar-drafts-overlay .dr-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(340px,1fr)); gap: 10px; }
    #ar-drafts-overlay .dr-it { background: #fff; border: 1px solid var(--d-line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
    #ar-drafts-overlay .dr-it:hover { background: #F8F9FB; }
    #ar-drafts-overlay .dr-it .t { font-size: 15.5px; font-weight: 600; line-height: 1.5; color: var(--d-ink); overflow-wrap: anywhere; }
    #ar-drafts-overlay .dr-it .m { font-size: 13px; color: var(--d-mut); line-height: 1.6; }
    #ar-drafts-overlay .dr-pill.gr { background: #EEF0F4; color: #3B4557; }
    #ar-drafts-overlay .dr-more { min-height: 48px; border-radius: 14px; border: 1px dashed #CBD2DE; background: #fff; color: var(--d-blue); font-weight: 600; font-size: 15px; }
    @media (max-width: 900px) {
      #ar-drafts-overlay .dr-content { padding: 14px; }
      #ar-drafts-overlay .dr-grid { grid-template-columns: minmax(0,1fr); }
    }
  </style>
</head>
<body>

  <main class="main">
    <div id="ar-drafts-overlay"><div class="dr-wrap" id="dr-wrap"><div class="dr-empty">লোড হচ্ছে...</div></div></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="./config.js"></script>
  <script src="./nav.js"></script>
  <script>
(function () {
  "use strict";

  // create.js-এর মতোই একই ImgBB key (AI-ছবি ও ছবি আপলোডের জন্য)
  var IMGBB_API_KEY = "99e869a5e930f58f491beb611c8f1bcd";

  var VERIFY_LABEL = {
    verified: "যাচাইকৃত",
    partially_verified: "আংশিক যাচাইকৃত",
    unverified: "অযাচাইকৃত",
    false_misleading: "ভুল/বিভ্রান্তিকর",
  };
  var REVIEW_LABEL = {
    pending_review: "রিভিউয়ের অপেক্ষায়",
    review_required: "রিভিউ প্রয়োজন",
    approved: "প্রকাশিত",
    rejected: "বাতিল",
  };
  var RESULT_LABEL = {
    published: "প্রকাশিত", draft_dry_run: "ড্রাফট (DRY-RUN)", held_for_review: "গেটে আটকা — রিভিউ লাগবে",
    insufficient: "প্রমাণ অপর্যাপ্ত", skipped_duplicate: "আগেই করা হয়েছে", skipped_few_sources: "সূত্র কম",
    daily_limit: "দৈনিক সীমা", time_budget: "সময় শেষ", discarded_weak_evidence: "যাচাই/মান গেটে উত্তীর্ণ হয়নি — বাতিল ও মুছে ফেলা হয়েছে", error: "ত্রুটি", pick_failed: "বিষয় বাছা যায়নি",
  };

  var user = null;
  var drafts = {};
  var aiStat = null;
  var statErr = "";
  var statBusy = false;
  var nr = null;
  var nrErr = "";
  var view = "pending"; // pending | held | published | rejected
  var section = "home"; // home | list | report | settings
  var backTo = "home";
  var openId = null;
  var imageAi = false;
  var overlay = null;

  /* ---------- ছোট সহায়ক ---------- */
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toArr(x) {
    if (!x) return [];
    return Array.isArray(x) ? x.filter(Boolean) : Object.keys(x).map(function (k) { return x[k]; });
  }
  function safeUrl(u) {
    return /^https?:\/\//i.test(String(u || "")) ? String(u) : "";
  }
  function fmt(ms) {
    if (!ms) return "";
    try {
      return new Intl.DateTimeFormat("bn-BD", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit", timeZone: "Asia/Dhaka" }).format(new Date(Number(ms)));
    } catch (e) { return ""; }
  }
  function $(id) { return document.getElementById(id); }
  function isPending(d) { return d.reviewStatus === "pending_review" || d.reviewStatus === "review_required"; }

  /* ---------- হেডার বাটন ও ব্যাজ ---------- */
  function pendingCount() {
    return Object.keys(drafts).filter(function (k) { return isPending(drafts[k]); }).length;
  }
  function updateBadge() {
    var b = $("dr-nav-badge");
    if (!b) return;
    var n = pendingCount();
    b.textContent = n > 99 ? "99+" : String(n);
    b.hidden = n === 0;
  }

  /* ---------- ড্যাশবোর্ড ও তালিকা ---------- */
  function nextRunText() {
    var p = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Dhaka", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date()).split(":");
    var m = Number(p[0]) * 60 + Number(p[1]);
    return m < 480 ? "আজ সকাল ৮:০০" : m < 1140 ? "আজ সন্ধ্যা ৭:০০" : "আগামীকাল সকাল ৮:০০";
  }
  function countBy(status) {
    return Object.keys(drafts).filter(function (k) { return drafts[k].reviewStatus === status; }).length;
  }
  function bulkHtml() {
    var isRej = view === "rejected";
    if (!isRej && view !== "held") return "";
    var n = isRej ? countBy("rejected") : countBy("review_required");
    if (!n) return "";
    return '<div class="dr-actions" style="margin:0"><button type="button" class="btn danger small" data-act="' + (isRej ? "delrejected" : "delreview") + '" style="flex:0 0 auto">' +
      (isRej ? "বাতিল করা সব (" + bn(n) + "টি) মুছুন" : "\"রিভিউ প্রয়োজন\" সব (" + bn(n) + "টি) মুছুন") + "</button></div>";
  }

  function counts() {
    var today = dayKey(Date.now()), c = { pending: 0, held: 0, published: 0, rejected: 0, pubToday: 0 };
    Object.keys(drafts).forEach(function (k) {
      var d = drafts[k];
      if (isHeld(d)) c.held++;
      else if (d.reviewStatus === "pending_review") c.pending++;
      if (d.reviewStatus === "approved") { c.published++; if (d.publishedAt && dayKey(d.publishedAt) === today) c.pubToday++; }
      if (d.reviewStatus === "rejected") c.rejected++;
    });
    return c;
  }
  function sortedIds() {
    return Object.keys(drafts).filter(function (id) { return inView(drafts[id]); })
      .sort(function (a, b) { return (drafts[b].createdAt || 0) - (drafts[a].createdAt || 0); });
  }
  function itemHtml(id) {
    var d = drafts[id], st = d.verificationStatus || "unverified", q = qaScore(d);
    var why = isHeld(d) && toArr(d.gateFailures).length ? " · কারণ: " + esc(toArr(d.gateFailures)[0]) : (d.reviewStatus === "review_required" && d.reviewNote ? " · " + esc(d.reviewNote) : "");
    return '<div class="dr-it" data-act="open" data-id="' + esc(id) + '"><div class="t">' + esc(d.title || "(শিরোনাম নেই)") + "</div>" +
      '<div class="m">' + esc(d.category || "") + (d.category ? " · " : "") + esc(fmt(d.createdAt)) + why + "</div>" +
      '<div><span class="dr-pill st-' + esc(st) + '">' + esc(VERIFY_LABEL[st] || "অযাচাইকৃত") + '</span><span class="dr-pill">' + esc(kindLabel(d)) + "</span>" +
      '<span class="dr-pill gr">সূত্র ' + bn(Number(d.independentSources) || toArr(d.sources).length) + "</span>" + (q != null ? '<span class="dr-pill gr">QA ' + bn(q) + "</span>" : "") + "</div></div>";
  }
  function tabsHtml(withRej, c) {
    function seg(v, label, n) { return '<button type="button" data-act="view" data-v="' + v + '" class="' + (view === v ? "on" : "") + '">' + label + " (" + bn(n) + ")</button>"; }
    return '<div class="dr-seg">' + seg("pending", "অপেক্ষায়", c.pending) + seg("held", "আটকা", c.held) + seg("published", "প্রকাশিত", c.published) + (withRej ? seg("rejected", "বাতিল", c.rejected) : "") + "</div>";
  }
  function homeHtml() {
    if (view === "rejected") view = "pending";
    var c = counts(), ids = sortedIds(), show = ids.slice(0, 4);
    function stat(v, n, label) { return '<button type="button" class="dr-stat" data-act="gotolist" data-v="' + v + '"><i>›</i><b>' + bn(n) + "</b><span>" + label + "</span></button>"; }
    return '<div class="dr-stats3">' + stat("published", c.pubToday, "আজ প্রকাশিত") + stat("pending", c.pending, "রিভিউ অপেক্ষায়") + stat("held", c.held, "গেটে আটকা") + "</div>" +
      '<div class="dr-sub">পরবর্তী রান: ' + nextRunText() + " · সংখ্যায় চাপ দিলে আলাদা পেজ খুলবে</div>" +
      tabsHtml(false, c) + '<div class="msg" id="dr-runmsg"></div>' +
      (show.length ? '<div class="dr-grid">' + show.map(itemHtml).join("") + "</div>" : '<div class="dr-empty">এখানে কিছু নেই।</div>') +
      (ids.length ? '<button type="button" class="dr-more" data-act="gotolist" data-v="' + view + '">সব দেখুন (' + bn(ids.length) + ") ›</button>" : "");
  }
  function listHtml() {
    var c = counts(), ids = sortedIds();
    var titles = { pending: "রিভিউ অপেক্ষায়", held: "গেটে আটকা", published: "প্রকাশিত", rejected: "বাতিল" };
    return '<div class="dr-top"><button type="button" class="btn ghost small" data-act="gotohome">‹ Home</button><h2>' + titles[view] + " — সব " + bn(ids.length) + "টি</h2></div>" +
      tabsHtml(true, c) + bulkHtml() + '<div class="msg" id="dr-runmsg"></div>' +
      (ids.length ? '<div class="dr-grid">' + ids.map(itemHtml).join("") + "</div>" : '<div class="dr-empty">এখানে কিছু নেই।</div>');
  }

  function reportHtml() {
    var catOpts = '<option value="">AI ঠিক করুক</option>' + REPORT_CATS.map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("");

      '<div class="dr-f"><label for="dr-newtitle">শিরোনাম / বিষয়</label><input type="text" id="dr-newtitle" placeholder="যেমন: পিএইচপিতে নতুন নিরাপত্তাত্রুটি"></div>' +
      '<div class="dr-f"><label for="dr-newurl">খবরের লিংক (ঐচ্ছিক)</label><input type="text" id="dr-newurl" placeholder="https://…"></div>' +
      '<div class="dr-f"><label for="dr-newtext">অতিরিক্ত তথ্য / পেস্ট করা লেখা (ঐচ্ছিক)</label><textarea id="dr-newtext" placeholder="খবরের লেখা বা নিশ্চিত তথ্য এখানে দিন"></textarea></div>' +

  }

  /* ---------- বিস্তারিত ---------- */
  function linkList(arr) {
    return (
      '<ul class="dr-links">' +
      arr.map(function (s) {
        var u = safeUrl(s.url);

        return "<li>" + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + label + "</a>" : label) + "</li>";
      }).join("") + "</ul>"
    );
  }

    var verifyBox =
      '<div class="dr-card"><h4>যাচাইয়ের ফল</h4>' +

      (warnings.length ? '<div class="dr-warn" style="margin-top:10px"><b>সতর্কতা / পরস্পরবিরোধী তথ্য:</b><br>' + warnings.map(esc).join("<br>") + "</div>" : "") +
      (unc.length ? '<div class="dr-note" style="margin-top:10px"><b>অনিশ্চিত বিষয়:</b><br>' + unc.map(esc).join("<br>") + "</div>" : "") +

    var form =
      '<div class="dr-card"><h4>' + (rr ? "কোনো লেখা তৈরি হয়নি" : "সংবাদ (সম্পাদনা করা যায়)") + "</h4>" +

      '<div class="dr-f"><label for="dr-image">ছবির লিংক</label><input type="text" id="dr-image" inputmode="url" value="' + esc(d.imageUrl || "") + '">' +
        '<img class="dr-imgprev" id="dr-imgprev" alt="" hidden>' +
        '<div class="dr-actions" style="margin-top:8px"><button type="button" class="btn secondary small" data-act="genimg" id="dr-genimg">AI দিয়ে ছবি বানান</button></div>' +

  /* ---------- Worker ও ImgBB ---------- */
  function getToken() {
    var u = window.firebase && window.firebase.auth && window.firebase.auth().currentUser;
    if (!u) return Promise.reject(new Error("লগইন পাওয়া যায়নি"));

  // অ্যাডমিন প্যানেল GitHub Pages-এ, তাই Worker-এর পূর্ণ ঠিকানা লাগে (ডোমেইন Worker-এ নিলে "https://arnews.info" দিন)
  var WORKER_BASE = "https://ar-news.abdulrohimrire019.workers.dev";

  function callWorker(path, body) {
    return getToken().then(function (token) {
      return fetch(WORKER_BASE + path, {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + token },
        body: JSON.stringify(body || {}),
      });
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || "সার্ভার ত্রুটি " + res.status);
        return data;
      });
    });
  }
  function uploadToImgbb(form) {
    return fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, { method: "POST", body: form })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || !data.success || !data.data || !data.data.url) throw new Error((data && data.error && data.error.message) || "আপলোড ব্যর্থ");
        return data.data.url;

  }

  var coverAi = { prompt: "", img: null };

  function loadImg(src, cors) {
    return new Promise(function (resolve, reject) {

      im.onload = function () { resolve(im); };

  function coverBackground(mode) {

  function wrapText(ctx, text, maxW) {
    var words = String(text).split(/\s+/).filter(Boolean), lines = [], cur = "";
    words.forEach(function (w) {
      var t = cur ? cur + " " + w : w;
      if (ctx.measureText(t).width <= maxW || !cur) { cur = t; }
      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function drawLogo(ctx, cx, cy, r) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#8fd8cf"; ctx.stroke();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#0b3d91"; ctx.font = "800 " + Math.round(r * 0.82) + 'px Arial, Helvetica, sans-serif';
    ctx.fillText("AR", cx, cy - r * 0.16);
    ctx.fillStyle = "#0f766e"; ctx.font = "700 " + Math.round(r * 0.26) + 'px Arial, Helvetica, sans-serif';
    ctx.fillText("NEWS", cx, cy + r * 0.52);
    ctx.restore();
  }

  function drawCover(canvas, bg, title, cat) {
    var W = 1200, H = 630, ctx = canvas.getContext("2d"), F = '"Hind Siliguri", "Noto Sans Bengali", sans-serif';
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0b3d91"; ctx.fillRect(0, 0, W, H);
    if (bg) {
      var sc = Math.max(W / bg.width, H / bg.height), w = bg.width * sc, h = bg.height * sc;
      ctx.drawImage(bg, (W - w) / 2, (H - h) / 2, w, h);
    }
    var g = ctx.createLinearGradient(0, 0, 0, H); // লেখা পড়ার জন্য গাঢ় আবরণ
    g.addColorStop(0, bg ? "rgba(6,20,58,0.55)" : "rgba(6,20,58,0)"); g.addColorStop(1, "rgba(6,20,58,0.88)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    drawLogo(ctx, 104, 96, 44);
    ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillStyle = "#ffffff"; ctx.font = "700 36px " + F;
    ctx.fillText("AR News", 164, 96);

    ctx.font = "700 28px " + F;
    var cw = ctx.measureText(cat).width + 44;
    ctx.fillStyle = "#0f766e"; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(64, 172, cw, 52, 26); else ctx.rect(64, 172, cw, 52);
    ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.fillText(cat, 86, 199);

    var size = 72, lines;
    for (;;) {
      ctx.font = "700 " + size + "px " + F;
      lines = wrapText(ctx, title, W - 128);
      if ((lines.length <= 4 && lines.length * size * 1.32 <= 330) || size <= 34) break;
      size -= 4;
    }
    ctx.textBaseline = "alphabetic"; ctx.fillStyle = "#ffffff";
    lines.forEach(function (ln, i) { ctx.fillText(ln, 64, 276 + size + i * size * 1.32); });

    ctx.font = "600 26px " + F; ctx.fillStyle = "#c9d8f5"; ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
    ctx.fillText("arnews.info", W - 64, H - 36);
  }

      title: f.title, category: f.category, summary: f.summary, content: f.content, seoTitle: f.seoTitle,
      metaDescription: f.metaDescription, keywords: f.keywords, slug: f.slug, imageUrl: f.imageUrl,
      imagePrompt: f.imagePrompt, socialPost: f.socialPost, xPost: f.xPost || "", imageAi: imageAi, updatedAt: Date.now(),
    };
  }

  function saveDraft() {
    var f = readForm();
    window.rtdb.ref("drafts/" + openId).update(draftPatch(f))
      .then(function () { setMsg("dr-msg", "সংরক্ষণ হয়েছে ✓", "ok"); })
      .catch(function (e) { setMsg("dr-msg", "সংরক্ষণ করা যায়নি: " + e.message, "bad"); });
  }

  function publish() {
    var id = openId;
    var d = drafts[id];
    var f = readForm();
    if (!f.title || !f.content) { setMsg("dr-msg", "শিরোনাম ও বিস্তারিত লেখা ছাড়া প্রকাশ করা যাবে না।", "bad"); return; }
    var st = d.verificationStatus || "unverified";
    var q = st === "verified"
      ? "এই খবরটি এখনই প্রকাশ করবেন?"
      : "এই খবরের যাচাই-স্ট্যাটাস: " + (VERIFY_LABEL[st] || st) + "।\nতবুও প্রকাশ করবেন?";
    if (!window.confirm(q)) return;

    var body = f.content;
    var srcNames = [];
    toArr(d.sources).forEach(function (s) { if (safeUrl(s.url) && s.title && srcNames.indexOf(s.title) < 0) srcNames.push(s.title); });
    if ($("dr-addsrc") && $("dr-addsrc").checked && srcNames.length) body += "\n\nতথ্যসূত্র: " + srcNames.slice(0, 8).join(", ");
    if ($("dr-addnote") && $("dr-addnote").checked) {
      body += "\n\n(এই সংবাদ AI সহায়তায় তৈরি এবং সম্পাদক কর্তৃক যাচাইকৃত।" + (imageAi && f.imageUrl ? " ছবিটি AI-নির্মিত প্রতীকী চিত্র।" : "") + ")";
    }

    var now = Date.now();
    var postId = window.rtdb.ref("posts").push().key;
    var post = {
      title: f.title,
      category: f.category,
      description: body,
      imageUrl: f.imageUrl,
      status: "published",
      authorId: user.uid,
      authorName: user.displayName || user.email || "এডমিন",
      createdAt: now,
      updatedAt: now,
      summary: f.summary,
      seoTitle: f.seoTitle,
      metaDescription: f.metaDescription,
      keywords: f.keywords,
      slug: f.slug,
      aiGenerated: true,
      verificationStatus: st,
      sources: toArr(d.sources).filter(function (s) { return safeUrl(s.url); }).slice(0, 10).map(function (s) { return { title: s.title || "", url: s.url }; }),
    };

    var upd = {};
    var patch = draftPatch(f);
    Object.keys(patch).forEach(function (k) { upd["drafts/" + id + "/" + k] = patch[k]; });
    upd["posts/" + postId] = post;
    upd["drafts/" + id + "/reviewStatus"] = "approved";
    upd["drafts/" + id + "/postId"] = postId;
    upd["drafts/" + id + "/publishedAt"] = now;

    setMsg("dr-msg", "প্রকাশ হচ্ছে…", "");
    window.rtdb.ref().update(upd)
      .then(function () { openId = null; render(); })
      .catch(function (e) { setMsg("dr-msg", "প্রকাশ করা যায়নি: " + e.message, "bad"); });
  }

  function reject() {
    if (!window.confirm("এই ড্রাফটটি বাতিল করবেন?")) return;
    window.rtdb.ref("drafts/" + openId).update({ reviewStatus: "rejected", updatedAt: Date.now() })
      .then(function () { openId = null; render(); })
      .catch(function (e) { setMsg("dr-msg", "বাতিল করা যায়নি: " + e.message, "bad"); });
  }

  function deleteDraft() {
    var id = openId;
    var d = drafts[id];
    if (!d) return;
    var q = "এই ড্রাফটটি স্থায়ীভাবে মুছে ফেলবেন? আর ফেরানো যাবে না।";
    if (d.reviewStatus === "approved") q += "\n(আগে প্রকাশিত পোস্টটি মুছবে না, শুধু এই ড্রাফটের রেকর্ড যাবে।)";
    if (!window.confirm(q)) return;
    setMsg("dr-delmsg", "মুছছে…", "");
    window.rtdb.ref("drafts/" + id).remove()
      .then(function () { openId = null; render(); })
      .catch(function (e) { setMsg("dr-delmsg", "মোছা যায়নি: " + e.message, "bad"); });
  }

  function bulkDelete(kind) {
    var want = kind === "rejected" ? "rejected" : "review_required";
    var ids = Object.keys(drafts).filter(function (id) { return drafts[id].reviewStatus === want; });
    if (!ids.length) return;
    var label = kind === "rejected" ? "বাতিল করা" : "\"রিভিউ প্রয়োজন\"";
    if (!window.confirm(label + " " + ids.length + "টি ড্রাফট স্থায়ীভাবে মুছে ফেলবেন? আর ফেরানো যাবে না।")) return;
    var upd = {};
    ids.forEach(function (id) { upd["drafts/" + id] = null; });
    window.rtdb.ref().update(upd).catch(function (e) { setMsg("dr-runmsg", "মোছা যায়নি: " + e.message, "bad"); });
  }

  function toCreateTab() {
    window.location.href = "./create.html";
  }

  /* ---------- X (টুইটার) পোস্ট ---------- */
  function updateXCount() {
    var el = $("dr-xcount"), t = $("dr-xpost");
    if (!el || !t) return;
    var n = t.value.length;
    el.textContent = bn(n) + " / ২৮০ অক্ষর" + (n > 280 ? " — সীমা পেরিয়েছে, ছোট করুন" : "");
  }
  function xGen() {
    var title = val("dr-title"), content = val("dr-content");
    if (content.length < 80) { setMsg("dr-xmsg", "আগে বিস্তারিত লেখা থাকতে হবে।", "bad"); return; }
    var btn = $("dr-xgen");
    btn.disabled = true;
    setMsg("dr-xmsg", "X পোস্ট লেখা হচ্ছে…", "");
    callWorker("/api/ai/xpost", { title: title, content: content })
      .then(function (r) {
        $("dr-xpost").value = r.xPost || "";
        updateXCount();
        setMsg("dr-xmsg", "✓ লেখা হয়েছে — দেখে নিন, দরকারে বদলান, তারপর কপি করুন। (সংরক্ষণ চাপলে রেখে দেওয়া হবে)", "ok");
      })
      .catch(function (e) { setMsg("dr-xmsg", "লেখা যায়নি: " + e.message, "bad"); })
      .then(function () { var b = $("dr-xgen"); if (b) b.disabled = false; });
  }
  function xCopy() {
    var t = $("dr-xpost");
    if (!t || !t.value.trim()) { setMsg("dr-xmsg", "কপি করার মতো কিছু নেই।", "bad"); return; }
    var done = function () { setMsg("dr-xmsg", "✓ কপি হয়েছে — X-এ পেস্ট করুন।", "ok"); };
    var legacy = function () { t.select(); try { document.execCommand("copy"); } catch (e) {} done(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, legacy);
    else legacy();
  }

  // nav.js যে হেডার/নিচের বার যোগ করে সেগুলো লুকানো — এই পেজের নিজস্ব হেডার ও নেভিগেশন আছে
  function hideSiteChrome() {
    Array.prototype.forEach.call(document.body.children, function (el) {
      var tg = el.tagName;
      if (tg === "SCRIPT" || tg === "MAIN" || tg === "STYLE" || tg === "LINK" || el.id === "ar-drafts-overlay") return;
      if (el.style.display !== "none") el.style.display = "none";
    });
  }
  hideSiteChrome();
  if (window.MutationObserver) new MutationObserver(hideSiteChrome).observe(document.body, { childList: true });

  /* ---------- ক্লিক হ্যান্ডলার ---------- */
  function onClick(e) {
    var el = e.target.closest && e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "open") { backTo = section === "list" ? "list" : "home"; openId = el.getAttribute("data-id"); render(); }
    else if (act === "back") { openId = null; section = backTo || "home"; render(); }
    else if (act === "gotolist") { view = el.getAttribute("data-v") || view; section = "list"; openId = null; render(); window.scrollTo(0, 0); }
    else if (act === "gotohome") { section = "home"; openId = null; render(); }
    else if (act === "nav") {
      section = el.getAttribute("data-s"); openId = null; render(); window.scrollTo(0, 0);
      if (section === "report") { loadStatus(); loadNr(); }
      if (section === "settings") loadNr();
    }
    else if (act === "view") { view = el.getAttribute("data-v"); render(); }
    else if (act === "refreshstat") loadStatus();
    else if (act === "genimg") genImage();
    else if (act === "report") runReport();
    else if (act === "nrrun") runNr();
    else if (act === "xgen") xGen();
    else if (act === "xcopy") xCopy();
    else if (act === "pickTitle") pickTitle(el.getAttribute("data-i"));
    else if (act === "cover") makeCover();
    else if (act === "coverdl") downloadCover();
    else if (act === "coveruse") useCover();
    else if (act === "save") saveDraft();
    else if (act === "publish") publish();
    else if (act === "reject") reject();
    else if (act === "manual") toCreateTab();
    else if (act === "delete") deleteDraft();
    else if (act === "delrejected") bulkDelete("rejected");
    else if (act === "delreview") bulkDelete("review");
  }

  /* ---------- শুরু ---------- */
  var auth = window.auth;
  if (!auth || !window.rtdb) {
    $("ar-drafts-overlay").innerHTML = '<div class="dr-empty bad">Firebase সংযোগ পাওয়া যায়নি — config.js ঠিকভাবে লোড হয়েছে কিনা দেখুন।</div>';
    return;
  }

  var started = false;
  auth.onAuthStateChanged(async function (u) {
    if (!u) { window.location.replace("./index.html"); return; }
    try {
      if (!(await window.isAdmin(u))) {
        await auth.signOut();
        alert("এই পেজ দেখার জন্য অ্যাডমিন অনুমতি প্রয়োজন।");
        window.location.replace("./index.html");
        return;
      }
    } catch (err) {
      console.error("Admin verification error:", err);
      $("ar-drafts-overlay").innerHTML = '<div class="dr-empty bad">অ্যাডমিন অনুমতি যাচাই করা যায়নি। Firebase Rules পরীক্ষা করুন।</div>';
      return;
    }
    user = u;
    if (started) return;
    started = true;
    openOverlay();

    window.rtdb.ref("drafts").orderByChild("createdAt").limitToLast(100).on("value", function (snap) {
      drafts = snap.val() || {};
      updateBadge();
      openPending(); // নতুন রিপোর্টের ড্রাফট এসে গেলে সরাসরি খোলে
      if (overlay && !openId) render();
    }, function (err) {
      console.error(err);
      $("dr-wrap").innerHTML = '<div class="dr-empty bad">ড্রাফট লোড করা যায়নি। Firebase Rules পরীক্ষা করুন।</div>';
    });
  });
})();
  </script>
</body>
</html>
