<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR News — অ্যাডমিন প্যানেল</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f2;
    --surface:#fff;
    --ink:#14201f;
    --muted:#5e6f6e;
    --line:#dbe3e2;
    --brand:#0f766e;
    --brand-ink:#0a4d47;
    --brand-soft:#e3f1ef;
    --nav-bg:#0c2f2c;
    --nav-ink:#e8f3f1;
    --nav-muted:#8fb5b0;
    --danger:#b42318;
    --danger-soft:#fde8e6;
    --warn:#b45309;
    --warn-soft:#fdf0dc;
    --ok:#15803d;
    --shadow:0 1px 2px rgba(12,47,44,.06),0 4px 14px rgba(12,47,44,.05);
    --font-display:'Tiro Bangla',Georgia,serif;
    --hh:60px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  /* ডার্ক মোড: সব ফাইলের ডিজাইন আপডেট শেষ হলে নিচের রুলটা @media(prefers-color-scheme:dark) এর ভেতরে বসিয়ে অটো চালু করা যাবে।
     এখন শুধু <html data-theme="dark"> দিলে চালু হয়। */
  :root[data-theme="dark"]{
    --bg:#0b1514;--surface:#122120;--ink:#e6efee;--muted:#8fa3a1;--line:#223635;
    --brand:#1a9d91;--brand-ink:#7fd8cd;--brand-soft:#16332f;--nav-bg:#081211;
    --danger:#f28b82;--danger-soft:#3a1a18;--warn:#f0b35a;--warn-soft:#33260f;--ok:#5fd08a;--shadow:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Hind Siliguri',system-ui,sans-serif;
    line-height:1.5;
    padding-bottom:calc(20px + var(--safe-b));
  }
  a{color:inherit}
  button{-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  /* hidden অ্যাট্রিবিউট যেন .btn, .top-nav ইত্যাদির display রুল ছাপিয়ে না যায় */
  [hidden]{display:none !important}

  /* ---------- header ---------- */
  .ar-nav{
    position:sticky;top:0;z-index:30;
    height:calc(var(--hh) + var(--safe-t));
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:var(--safe-t) 16px 0;
    background:var(--nav-bg);color:var(--nav-ink);
  }
  .ar-brand{
    display:flex;align-items:center;gap:11px;
    font-family:var(--font-display);font-weight:400;font-size:18px;line-height:1.15;
    text-decoration:none;min-width:0;color:var(--nav-ink);
  }
  .ar-brand img{width:34px;height:34px;border-radius:9px;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.16)}
  .ar-brand small{
    display:block;font-family:'Hind Siliguri',sans-serif;
    font-weight:400;font-size:11.5px;color:var(--nav-muted);margin-top:2px;
  }
  #nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .who{
    font-size:12.5px;color:var(--nav-muted);max-width:140px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none;
  }
  @media(min-width:520px){.who{display:inline-block}}

  /* ---------- navigation ---------- */
  .top-nav{
    position:sticky;
    top:calc(var(--hh) + var(--safe-t));
    z-index:25;
    display:flex;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .top-nav[hidden]{display:none !important}
  .top-nav::-webkit-scrollbar{display:none}
  .top-nav button{
    flex:1 0 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-width:60px;padding:9px 6px 8px;
    border:0;border-bottom:3px solid transparent;
    background:none;color:var(--muted);
    font:inherit;font-size:11.5px;font-weight:600;
    cursor:pointer;position:relative;
  }
  .top-nav button svg{width:20px;height:20px}
  .top-nav button.active{color:var(--brand);border-bottom-color:var(--brand)}
  .nav-badge{
    position:absolute;top:4px;left:calc(50% + 5px);
    min-width:17px;height:17px;padding:0 5px;
    border-radius:999px;background:var(--danger);color:#fff;
    font-size:10.5px;font-weight:700;line-height:1;
    display:none;align-items:center;justify-content:center;
  }
  .nav-badge.show{display:flex}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    text-align:center;text-decoration:none;
    border:0;border-radius:10px;padding:10px 16px;
    background:var(--brand);color:#fff;
    font:inherit;font-weight:600;font-size:14px;cursor:pointer;
  }
  .btn:active{opacity:.85}
  .btn.secondary{background:var(--brand-soft);color:var(--brand-ink)}
  .btn.danger{background:var(--danger-soft);color:var(--danger)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.small{padding:7px 12px;font-size:12.5px;border-radius:8px}
  .btn.icon{width:38px;height:38px;padding:0;border-radius:50%}
  .btn[disabled]{opacity:.55;cursor:default}
  .btn svg{width:17px;height:17px}

  /* ---------- shell / gate ---------- */
  .shell{max-width:680px;margin:0 auto;padding:20px 14px 30px}
  .gate{
    max-width:400px;margin:10vh auto;
    background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:30px 24px;box-shadow:var(--shadow);
  }
  .gate h2{font-family:var(--font-display);font-weight:400;margin:0 0 6px;font-size:24px}
  .gate p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.6}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field textarea,.field select{
    width:100%;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font:inherit;font-size:15px;background:var(--surface);color:var(--ink);
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent);
  }
  .field textarea{min-height:150px;resize:vertical;line-height:1.6}
  .img-hint{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .img-hint.ok{color:var(--ok)}
  .img-hint.bad{color:var(--danger)}
  .img-preview-wrap{
    margin-top:10px;border:1px solid var(--line);border-radius:12px;
    overflow:hidden;background:var(--bg);
  }
  .img-preview{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .error{
    background:var(--danger-soft);color:var(--danger);
    font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:14px;
    display:none;line-height:1.5;
  }
  .error.show{display:block}
  .msg{font-size:12.5px;margin-top:8px;min-height:16px}
  .msg.ok{color:var(--ok)}
  .msg.bad{color:var(--danger)}
  .loading-line{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}

  /* ---------- panels / cards ---------- */
  .panel{
    background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .panel h2{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.25;margin:0 0 4px}
  .panel .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .empty{
    color:var(--muted);text-align:center;padding:30px 12px;font-size:13.5px;
    border:1px dashed var(--line);border-radius:14px;background:var(--surface);
  }
  /* পোস্ট প্যানেলের কার্ড নিজেই posts.js থেকে আসে, তাই বাইরের প্যানেল স্বচ্ছ */
  #panel-posts{background:none;border:0;box-shadow:none;padding:0}

  /* list cards (বিজ্ঞাপন প্যানেল ইত্যাদিতে ব্যবহৃত) */
  .post-list{display:grid;gap:10px}
  .post-item{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--surface)}
  .post-item img{
    width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;
    margin-bottom:10px;background:var(--bg);display:block;
  }
  .post-item h3{
    font-family:var(--font-display);font-weight:400;font-size:16.5px;margin:0 0 6px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.4;
  }
  .post-item p{margin:5px 0;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;line-height:1.6}
  .post-meta{font-size:12px;color:var(--muted)}
  .post-engage{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
  .post-engage span{display:inline-flex;align-items:center;gap:4px}
  .post-engage svg{width:14px;height:14px}
  .item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .status-tag{
    display:inline-block;font-size:11.5px;font-weight:600;
    padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);
  }
  .status-tag.draft{background:var(--line);color:var(--muted)}
  .status-tag.ad-badge{background:var(--warn-soft);color:var(--warn)}
  .search-box{margin-bottom:14px}
  .search-box input{
    width:100%;border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;font:inherit;font-size:14.5px;background:var(--surface);color:var(--ink);
  }
  .search-box input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}

  /* stats — জোড়া লাগানো একটা স্ট্রিপ */
  .stats-row{
    display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;margin-bottom:8px;
  }
  .stat-card{padding:14px 14px 13px;background:var(--surface)}
  .stat-card .label{display:block;color:var(--muted);font-size:12px}
  .stat-card strong{
    display:block;color:var(--ink);font-size:27px;line-height:1.25;margin-top:4px;
    font-family:var(--font-display);font-weight:400;
  }
  @media(min-width:460px){.stats-row{grid-template-columns:repeat(3,1fr)}}
  .top-post-row{
    display:flex;align-items:center;gap:12px;padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .top-post-row:last-child{border-bottom:0}
  .top-post-row .rank{
    width:26px;height:26px;border-radius:8px;flex-shrink:0;
    background:var(--brand-soft);color:var(--brand-ink);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;
  }
  .top-post-row .ttl{
    flex:1;min-width:0;font-size:14px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .top-post-row .sc{font-size:12px;color:var(--muted);flex-shrink:0}

  /* reports */
  .filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .filter-btn{
    border:1px solid var(--line);background:var(--surface);color:var(--muted);
    font:inherit;font-weight:600;font-size:13px;padding:6px 14px;
    border-radius:999px;cursor:pointer;
  }
  .filter-btn.active{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .report-list{display:grid;gap:10px}
  .report-item{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface)}
  .report-item.status-pending{border-left:4px solid var(--danger)}
  .report-item.status-reviewed{border-left:4px solid var(--brand)}
  .report-item.status-dismissed{border-left:4px solid var(--line);opacity:.75}
  .report-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .reason-tag{
    display:inline-block;font-size:11.5px;font-weight:600;
    padding:2px 10px;border-radius:999px;background:var(--danger-soft);color:var(--danger);
  }
  .report-status{font-size:12px;font-weight:600;color:var(--muted);margin-left:auto}
  .report-comment{
    background:var(--bg);border-radius:10px;padding:10px 12px;
    font-size:13.5px;margin:9px 0;overflow-wrap:anywhere;line-height:1.6;
  }
  .report-comment .by{
    display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;font-weight:600;
  }
  .report-meta{font-size:12.5px;color:var(--muted);margin-bottom:3px;line-height:1.6}
  .report-meta a{color:var(--brand-ink);font-weight:600;text-decoration:none}
  .report-meta a:hover{text-decoration:underline}

  /* users */
  .user-list{display:grid;gap:8px}
  .user-row{
    display:flex;align-items:center;gap:12px;
    border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--surface);
  }
  .user-avatar{
    width:40px;height:40px;border-radius:50%;
    background:var(--brand-soft);color:var(--brand-ink);font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;text-transform:uppercase;overflow:hidden;
  }
  .user-avatar img{width:100%;height:100%;object-fit:cover}
  .user-info{min-width:0;flex:1}
  .user-name{
    font-size:14px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .user-email{
    font-size:12px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .role-badge{
    font-size:11.5px;font-weight:600;
    padding:2px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);
    flex-shrink:0;
  }
  .role-badge.admin{background:var(--ink);color:var(--surface)}

  /* header right actions */
  .nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0}

  /* হেডারের লগআউট বাটন: আইকন, বড় স্ক্রিনে পাশে "লগআউট" লেখা */
  #nav-actions #logout-btn.icon{
    width:38px;height:38px;padding:0;border-radius:10px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    color:var(--nav-ink);
  }
  #nav-actions #logout-btn.icon:hover{background:rgba(255,255,255,.16)}
  #nav-actions #logout-btn.icon svg{width:18px;height:18px}
  @media(min-width:520px){
    #nav-actions #logout-btn.icon{width:auto;padding:0 14px}
    #nav-actions #logout-btn.icon::after{content:"লগআউট";font-size:13px;font-weight:600}
  }
  /* "অনুমতি নেই" পেজে বসা লগআউট বাটন হেডারের গাঢ় রঙে পড়া সহজ রাখে */
  #nav-actions #logout-btn.secondary{background:rgba(255,255,255,.1);color:var(--nav-ink)}

  /* ---------- ডেস্কটপ: বাঁ পাশে সাইডবার ---------- */
  @media(min-width:900px){
    .top-nav{
      position:fixed;left:0;top:calc(var(--hh) + var(--safe-t));bottom:0;width:236px;
      flex-direction:column;gap:4px;padding:18px 12px;
      border-bottom:0;border-right:1px solid var(--line);overflow-y:auto;
    }
    .top-nav button{
      flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;
      min-width:0;padding:11px 14px;font-size:14.5px;
      border-radius:10px;border-bottom:0;text-align:left;
    }
    .top-nav button.active{background:var(--brand-soft);color:var(--brand-ink)}
    .nav-badge{position:static;order:3;margin-left:auto}
    .shell{max-width:none;margin:0 0 0 236px;padding:30px 44px 40px}
    .shell>section{max-width:860px}
    .top-nav[hidden] ~ .shell{margin:0 auto;max-width:680px}
    .stat-card strong{font-size:32px}
  }
</style>
</head>
<body>
  <header class="ar-nav">
    <a class="ar-brand" href="feed.html">
      <img src="logo.png" alt="AR News">
      <span>AR News<small>অ্যাডমিন প্যানেল</small></span>
    </a>
    <div class="nav-right">
      <div id="nav-actions"></div>
    </div>
  </header>

  <!-- উপরের ছোট বক্স নেভিগেশন (নিচের নেভ সরিয়ে এখানে) -->
  <nav class="top-nav" id="bottom-nav"></nav>

  <main class="shell" id="app">
    <div class="loading-line">লোড হচ্ছে…</div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>

  <script src="login.js?v=2"></script>
  <script src="create.js?v=2"></script>
  <script src="posts.js?v=2"></script>
  <script src="reports.js?v=2"></script>
  <script src="users.js?v=2"></script>
  <script src="stats.js?v=2"></script>
  <script src="ad.js?v=2"></script>
  <script src="advertise.js?v=2"></script>
  <script src="contact.js?v=2"></script>
</body>
</html>
