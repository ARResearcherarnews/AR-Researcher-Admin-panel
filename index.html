<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR News — অ্যাডমিন প্যানেল</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f7; --ink:#151515; --muted:#6b6b6b; --line:#e3e3e3;
    --brand:#0f766e; --brand-ink:#0b3d38; --brand-soft:#eef5f4;
    --surface:#fff; --danger:#c0392b; --danger-soft:#fdecea; --warn:#b8860b;
    --font-display:'Tiro Bangla',Georgia,serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --nav-h: 62px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 10px)}
  a{color:inherit}
  button{-webkit-tap-highlight-color:transparent}

  /* ---------- header ---------- */
  .ar-nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + var(--safe-t)) 16px 12px;background:#fff;border-bottom:1px solid var(--line)}
  .ar-brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:17px;text-decoration:none;min-width:0}
  .ar-brand img{width:28px;height:28px;border-radius:7px;flex-shrink:0}
  .ar-brand small{display:block;font-family:'Hind Siliguri',sans-serif;font-weight:600;font-size:10.5px;color:var(--muted);letter-spacing:.03em}
  #nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .who{font-size:12px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none}
  @media(min-width:520px){.who{display:inline-block}}

  /* ---------- buttons ---------- */
  .btn{display:inline-block;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn:active{opacity:.85}
  .btn.secondary{background:var(--brand-soft);color:var(--brand-ink)}
  .btn.danger{background:var(--danger)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.small{padding:8px 12px;font-size:12.5px;border-radius:8px}
  .btn.icon{width:38px;height:38px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .btn[disabled]{opacity:.55;cursor:default}
  .btn svg{width:17px;height:17px}

  /* ---------- shell / gate ---------- */
  .shell{max-width:640px;margin:0 auto;padding:18px 14px 30px}
  .gate{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px}
  .gate h2{font-family:var(--font-display);margin:0 0 6px;font-size:22px}
  .gate p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.6}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:1px}
  .field textarea{min-height:150px;resize:vertical;line-height:1.6}
  .img-hint{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .img-hint.ok{color:#178a5c}
  .img-hint.bad{color:var(--danger)}
  .img-preview-wrap{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f2f2f2}
  .img-preview{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .error{background:var(--danger-soft);color:var(--danger);font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;display:none;line-height:1.5}
  .error.show{display:block}
  .msg{font-size:12.5px;margin-top:8px;min-height:16px}
  .msg.ok{color:var(--brand)}
  .msg.bad{color:var(--danger)}
  .loading-line{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}

  /* ---------- panels / cards ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  .panel h2{font-family:var(--font-display);font-size:19px;margin:0 0 4px}
  .panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:13.5px}

  /* post list */
  .post-list{display:grid;gap:10px}
  .post-item{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}
  .post-item img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;margin-bottom:10px;background:#f2f2f2;display:block}
  .post-item h3{font-family:var(--font-display);font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.4}
  .post-item p{margin:5px 0;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;line-height:1.6}
  .post-meta{font-size:12px;color:var(--muted)}
  .post-engage{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
  .post-engage span{display:inline-flex;align-items:center;gap:4px}
  .post-engage svg{width:14px;height:14px}
  .item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .status-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink)}
  .status-tag.draft{background:#f2f2f2;color:var(--muted)}
  .status-tag.ad-badge{background:#fdf3e0;color:var(--warn)}
  .search-box{margin-bottom:14px}
  .search-box input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;font-size:14px}

  /* stats */
  .stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
  .stat-card{border:1px solid var(--line);border-radius:13px;padding:14px;background:linear-gradient(135deg,#fff,#f4f9f8)}
  .stat-card .label{display:block;color:var(--muted);font-size:11.5px}
  .stat-card strong{display:block;color:var(--brand-ink);font-size:24px;margin-top:4px;font-family:var(--font-display)}
  @media(min-width:460px){.stats-row{grid-template-columns:repeat(3,1fr)}}
  .top-post-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .top-post-row:last-child{border-bottom:0}
  .top-post-row .rank{font-family:var(--font-display);font-weight:800;color:var(--muted);width:20px;flex-shrink:0;text-align:center}
  .top-post-row .ttl{flex:1;min-width:0;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top-post-row .sc{font-size:12px;color:var(--muted);flex-shrink:0}

  /* reports */
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filter-btn{border:1px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:999px;cursor:pointer}
  .filter-btn.active{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
  .report-list{display:grid;gap:10px}
  .report-item{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
  .report-item.status-pending{border-left:4px solid var(--danger)}
  .report-item.status-reviewed{border-left:4px solid var(--brand)}
  .report-item.status-dismissed{border-left:4px solid var(--line);opacity:.7}
  .report-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .reason-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px;background:var(--danger-soft);color:var(--danger)}
  .report-status{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:6px;background:var(--brand-soft);color:var(--brand-ink);margin-left:auto}
  .report-comment{background:#f7f7f7;border-radius:10px;padding:11px 13px;font-size:13.5px;margin:9px 0;overflow-wrap:anywhere;line-height:1.6}
  .report-comment .by{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:700}
  .report-meta{font-size:12px;color:var(--muted);margin-bottom:3px;line-height:1.6}
  .report-meta a{color:var(--brand-ink);font-weight:700;text-decoration:none}
  .report-meta a:hover{text-decoration:underline}

  /* users */
  .user-list{display:grid;gap:8px}
  .user-row{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
  .user-avatar{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-transform:uppercase;overflow:hidden}
  .user-avatar img{width:100%;height:100%;object-fit:cover}
  .user-info{min-width:0;flex:1}
  .user-name{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-email{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .role-badge{font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);flex-shrink:0}
  .role-badge.admin{background:var(--brand-ink);color:#fff}

  /* ---------- bottom nav ---------- */
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border:0;background:none;color:var(--muted);font:inherit;font-size:10.5px;font-weight:700;cursor:pointer;position:relative}
  .bottom-nav button.active{color:var(--brand)}
  .bottom-nav svg{width:21px;height:21px}
  .nav-badge{position:absolute;top:3px;right:22%;min-width:16px;height:16px;padding:0 3px;border-radius:999px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;display:none;align-items:center;justify-content:center;line-height:1}
  .nav-badge.show{display:flex}
</style>
</head>
<body>
  <header class="ar-nav">
    <a class="ar-brand" href="feed.html"><img src="logo.png" alt="AR News"><span>AR News<small>অ্যাডমিন প্যানেল</small></span></a>
    <div id="nav-actions"></div>
  </header>

  <main class="shell" id="app">
    <div class="loading-line">লোড হচ্ছে…</div>
  </main>

  <nav class="bottom-nav" id="bottom-nav" hidden></nav>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>

  <script src="login.js?v=1"></script>
  <script src="create.js?v=1"></script>
  <script src="posts.js?v=1"></script>
  <script src="reports.js?v=1"></script>
  <script src="users.js?v=1"></script>
  <script src="stats.js?v=1"></script>
  <script src="ad.js?v=1"></script>
</body>
</html>
