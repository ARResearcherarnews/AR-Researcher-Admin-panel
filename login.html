<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR News — লগইন</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .login-page{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f7faf9}.login-card{width:min(100%,410px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 12px 35px rgba(20,50,45,.08)}.login-brand{text-align:center;margin-bottom:20px}.login-brand img{width:52px;height:52px;border-radius:13px;margin:0 auto 8px}.login-brand h1{font-family:var(--font-display);font-size:25px;margin:0}.login-brand p{color:var(--muted);font-size:13px;margin:5px 0 0}.login-error{display:none;padding:10px 12px;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-size:13px;margin-bottom:14px}.login-error.show{display:block}.login-submit{width:100%;border:0;border-radius:9px;background:var(--brand);color:#fff;font:inherit;font-weight:700;padding:12px;cursor:pointer}.login-submit:disabled{opacity:.6;cursor:wait}.login-links{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}.login-links a{color:var(--brand-ink);font-weight:600}
  </style>
</head>
<body>
  <main class="login-page"><section class="login-card">
    <div class="login-brand"><img src="logo.png" alt="AR News"><h1>AR News</h1><p>অ্যাডমিন প্যানেলে প্রবেশ করুন</p></div>
    <div id="login-error" class="login-error" role="alert"></div>
    <form id="login-form">
      <div class="ar-field"><label for="email">ইমেইল</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="ar-field"><label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" required minlength="6"></div>
      <button class="login-submit" id="login-submit" type="submit">লগইন করুন</button>
    </form>
    <div class="login-links"><a href="admin.html">ফিডে ফিরে যান</a></div>
  </section></main>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
